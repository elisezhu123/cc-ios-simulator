<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="iOS Simulator for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="1" stop-color="#2b2140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#f0a86b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#8f5cff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.05">
    <circle cx="1120" cy="40" r="160"/>
    <circle cx="980" cy="330" r="120"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <text x="64" y="118" font-size="54" font-weight="700" fill="#ffffff">iOS Simulator</text>
    <text x="64" y="172" font-size="30" font-weight="600" fill="url(#accent)">for Claude Code</text>
    <text x="64" y="224" font-size="22" fill="#c9cdd8">让 Claude 看得见、点得动你的 iOS 模拟器</text>
    <g font-size="15" fill="#e8e9ee">
      <rect x="64" y="252" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="123" y="273" text-anchor="middle">实时画面面板</text>
      <rect x="192" y="252" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="251" y="273" text-anchor="middle">点击 · 手势</text>
      <rect x="320" y="252" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="379" y="273" text-anchor="middle">构建 · 运行</text>
      <rect x="448" y="252" width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="518" y="273" text-anchor="middle">29 个 MCP 工具</text>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(900 34)">
    <rect x="0" y="0" width="150" height="262" rx="28" fill="#0d0f14" stroke="#3a3f4d" stroke-width="3"/>
    <rect x="8" y="8" width="134" height="246" rx="21" fill="url(#screen)"/>
    <rect x="52" y="16" width="46" height="12" rx="6" fill="#0d0f14"/>
    <g fill="#ffffff" fill-opacity="0.9">
      <rect x="22" y="46" width="24" height="24" rx="6"/>
      <rect x="63" y="46" width="24" height="24" rx="6"/>
      <rect x="104" y="46" width="24" height="24" rx="6"/>
      <rect x="22" y="84" width="24" height="24" rx="6"/>
      <rect x="63" y="84" width="24" height="24" rx="6"/>
      <rect x="104" y="84" width="24" height="24" rx="6"/>
      <rect x="22" y="122" width="24" height="24" rx="6"/>
      <rect x="63" y="122" width="24" height="24" rx="6"/>
    </g>
    <rect x="16" y="208" width="118" height="34" rx="12" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="50" y="244" width="50" height="4" rx="2" fill="#ffffff" fill-opacity="0.8"/>
    <!-- tap ripple -->
    <circle cx="75" cy="134" r="10" fill="none" stroke="#f0a86b" stroke-width="3"/>
    <circle cx="75" cy="134" r="18" fill="none" stroke="#f0a86b" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- claude spark -->
  <g transform="translate(1110 150)" fill="url(#accent)">
    <path d="M0 -34 L6 -6 L34 0 L6 6 L0 34 L-6 6 L-34 0 L-6 -6 Z"/>
  </g>
  <path d="M1076 150 C 1060 150, 1070 168, 1040 168" fill="none" stroke="#f0a86b" stroke-width="2" stroke-dasharray="4 5"/>
</svg>
