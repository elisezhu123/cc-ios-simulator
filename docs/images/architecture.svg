<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="插件架构图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7080"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1f2330">

    <!-- Claude Code -->
    <rect x="30" y="40" width="190" height="110" rx="12" fill="#fbeee8" stroke="#d9653b" stroke-width="1.5"/>
    <text x="125" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#b4502c">Claude Code</text>
    <text x="125" y="98" text-anchor="middle">Skill: ios-ui-automation</text>
    <text x="125" y="120" text-anchor="middle" fill="#6b7080">观察 → 操作 → 确认</text>

    <!-- Browser -->
    <rect x="30" y="390" width="190" height="110" rx="12" fill="#eef3ff" stroke="#4f7cff" stroke-width="1.5"/>
    <text x="125" y="422" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5bd8">浏览器面板</text>
    <text x="125" y="448" text-anchor="middle">Code 标签页 / 任意浏览器</text>
    <text x="125" y="470" text-anchor="middle" fill="#6b7080">你亲手点、拖、旋转</text>

    <!-- MCP server container -->
    <rect x="290" y="20" width="370" height="510" rx="14" fill="#f6f7f9" stroke="#c9cdd8" stroke-dasharray="6 5"/>
    <text x="475" y="46" text-anchor="middle" font-size="15" font-weight="700">MCP 服务 · dist/server.js</text>

    <rect x="310" y="64" width="330" height="164" rx="10" fill="#ffffff" stroke="#c9cdd8"/>
    <text x="475" y="88" text-anchor="middle" font-weight="700">工具层（MCP SDK + zod，23 个 ios_sim_*）</text>
    <g font-size="12" fill="#3a3f4d">
      <text x="326" y="112">核心：devices · boot · shutdown · panel</text>
      <text x="326" y="132">　　　screenshot · interact</text>
      <text x="326" y="152">App：list_apps · launch_app · build_run · install / uninstall</text>
      <text x="326" y="172">环境：open_url · push · location · appearance · record</text>
      <text x="326" y="192" fill="#b4502c">UI：ui_tree · tap_element · ui_rows · tap_row</text>
      <text x="326" y="212" fill="#b4502c">　　 find_text · tap_text · wait_for</text>
    </g>

    <rect x="310" y="246" width="160" height="100" rx="10" fill="#ffffff" stroke="#c9cdd8"/>
    <text x="390" y="272" text-anchor="middle" font-weight="700">命令行助手</text>
    <text x="390" y="294" text-anchor="middle" font-size="12" fill="#6b7080">simctl · xcodebuild</text>
    <text x="390" y="312" text-anchor="middle" font-size="12" fill="#6b7080">AXe 无障碍树 · Vision OCR</text>
    <text x="390" y="330" text-anchor="middle" font-size="12" fill="#6b7080">execFile 参数数组</text>

    <rect x="480" y="246" width="160" height="100" rx="10" fill="#ffffff" stroke="#c9cdd8"/>
    <text x="560" y="272" text-anchor="middle" font-weight="700">SimHostController</text>
    <text x="560" y="294" text-anchor="middle" font-size="12" fill="#6b7080">serve-sim 生命周期</text>
    <text x="560" y="312" text-anchor="middle" font-size="12" fill="#6b7080">保活 · 空闲停流 · 接管</text>

    <rect x="310" y="390" width="330" height="120" rx="10" fill="#ffffff" stroke="#c9cdd8"/>
    <text x="475" y="414" text-anchor="middle" font-weight="700">PanelServer · 127.0.0.1:3456+</text>
    <g font-size="12" fill="#3a3f4d">
      <text x="326" y="438">GET /stream　 → 代理 serve-sim MJPEG</text>
      <text x="326" y="458">WS  /ws　　　 → 转发触控 / 按键 / 旋转</text>
      <text x="326" y="478">/api/*　　　　 设备列表 · 切换 · 截图 · 设备操作</text>
      <text x="326" y="498" fill="#b4502c">fence：仅回环 · Host / Origin 校验 · JSON 限 16KB</text>
    </g>

    <!-- serve-sim + simulator -->
    <rect x="730" y="170" width="200" height="90" rx="12" fill="#eefaf1" stroke="#28a745" stroke-width="1.5"/>
    <text x="830" y="202" text-anchor="middle" font-size="16" font-weight="700" fill="#1f7a36">serve-sim</text>
    <text x="830" y="226" text-anchor="middle">MJPEG 视频流</text>
    <text x="830" y="246" text-anchor="middle">WebSocket 控制通道</text>

    <rect x="730" y="360" width="200" height="110" rx="12" fill="#1f2330"/>
    <text x="830" y="396" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">iOS 模拟器</text>
    <text x="830" y="422" text-anchor="middle" fill="#c9cdd8">Xcode · Apple Silicon</text>
    <text x="830" y="446" text-anchor="middle" fill="#c9cdd8">iPhone / iPad</text>

    <!-- arrows -->
    <g stroke="#6b7080" stroke-width="1.6" fill="none">
      <path d="M220 95 L308 120" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
      <path d="M220 445 L308 450" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
      <path d="M400 228 L400 244" marker-end="url(#arrow)"/>
      <path d="M560 228 L560 244" marker-end="url(#arrow)"/>
      <path d="M640 290 L728 245" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
      <path d="M560 390 L560 350" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
      <path d="M830 262 L830 358" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
      <path d="M390 346 L390 366 L705 366 L705 412 L728 412" marker-end="url(#arrow)"/>
    </g>
    <g font-size="11" fill="#6b7080">
      <text x="238" y="98">stdio</text>
      <text x="236" y="438">HTTP / WS</text>
      <text x="840" y="324">触控 / 画面</text>
      <text x="572" y="380">画面流</text>
      <text x="600" y="360">命令行调用</text>
    </g>
  </g>
</svg>
