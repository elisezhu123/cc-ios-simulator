<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-label="实时面板示意图">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6cff"/>
      <stop offset="0.55" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#ff7aa8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <!-- browser window -->
  <rect x="10" y="10" width="860" height="620" rx="14" fill="#f5f6f8" stroke="#d6d9e0" filter="url(#shadow)"/>
  <path d="M10 24 a14 14 0 0 1 14 -14 h832 a14 14 0 0 1 14 14 v22 h-860 z" fill="#e7e9ee"/>
  <circle cx="34" cy="29" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="29" r="6" fill="#febc2e"/>
  <circle cx="74" cy="29" r="6" fill="#28c840"/>
  <rect x="200" y="18" width="480" height="22" rx="11" fill="#ffffff" stroke="#d6d9e0"/>
  <text x="440" y="34" font-size="12" fill="#6b7080" text-anchor="middle">http://127.0.0.1:3456/</text>

  <!-- topbar -->
  <rect x="10" y="46" width="860" height="44" fill="#ffffff"/>
  <rect x="26" y="56" width="250" height="26" rx="6" fill="#f2f3f6" stroke="#d6d9e0"/>
  <text x="38" y="74" font-size="13" fill="#1f2330">iPhone 17 Pro · iOS 26.0（已启动）</text>
  <text x="262" y="74" font-size="11" fill="#6b7080">▾</text>
  <circle cx="298" cy="69" r="5" fill="#28c840"/>
  <text x="310" y="74" font-size="13" fill="#1f2330">iPhone 17 Pro · 实时</text>

  <!-- toolbar -->
  <rect x="10" y="90" width="860" height="44" fill="#fafbfc" stroke="#eceef2"/>
  <g font-size="12" fill="#1f2330">
    <rect x="26" y="99" width="78" height="26" rx="6" fill="#ffffff" stroke="#d6d9e0"/>
    <text x="65" y="116" text-anchor="middle">⌂ 回到桌面</text>
    <rect x="112" y="99" width="62" height="26" rx="6" fill="#ffffff" stroke="#d6d9e0"/>
    <text x="143" y="116" text-anchor="middle">◉ 截图</text>
    <rect x="182" y="99" width="62" height="26" rx="6" fill="#ffffff" stroke="#d6d9e0"/>
    <text x="213" y="116" text-anchor="middle">⟳ 旋转</text>
    <rect x="252" y="99" width="96" height="26" rx="6" fill="#ffffff" stroke="#d6d9e0"/>
    <text x="300" y="116" text-anchor="middle">设备操作… ▾</text>
    <rect x="356" y="99" width="62" height="26" rx="6" fill="#ffffff" stroke="#d6d9e0"/>
    <text x="387" y="116" text-anchor="middle">↻ 刷新</text>
    <rect x="690" y="99" width="70" height="26" rx="6" fill="#ffffff" stroke="#d6d9e0"/>
    <text x="725" y="116" text-anchor="middle">适应 ▾</text>
    <rect x="768" y="99" width="86" height="26" rx="6" fill="#ffffff" stroke="#d6d9e0"/>
    <text x="811" y="116" text-anchor="middle">真机框 ▾</text>
  </g>

  <!-- stage -->
  <rect x="10" y="134" width="860" height="482" fill="#eef0f4"/>

  <!-- device frame -->
  <g transform="translate(330 150)">
    <rect x="0" y="0" width="220" height="452" rx="40" fill="#1a1c22" stroke="#4a4f5c" stroke-width="3"/>
    <rect x="10" y="10" width="200" height="432" rx="31" fill="url(#wall)"/>
    <rect x="80" y="20" width="60" height="16" rx="8" fill="#1a1c22"/>
    <text x="30" y="33" font-size="11" font-weight="600" fill="#ffffff">9:41</text>
    <g font-size="8" fill="#ffffff" text-anchor="middle">
      <g fill="#ffffff" fill-opacity="0.92">
        <rect x="24" y="58" width="36" height="36" rx="9"/>
        <rect x="70" y="58" width="36" height="36" rx="9"/>
        <rect x="116" y="58" width="36" height="36" rx="9"/>
        <rect x="162" y="58" width="36" height="36" rx="9"/>
        <rect x="24" y="116" width="36" height="36" rx="9"/>
        <rect x="70" y="116" width="36" height="36" rx="9"/>
        <rect x="116" y="116" width="36" height="36" rx="9"/>
        <rect x="162" y="116" width="36" height="36" rx="9"/>
        <rect x="24" y="174" width="36" height="36" rx="9"/>
        <rect x="70" y="174" width="36" height="36" rx="9"/>
      </g>
      <text x="42" y="106">日历</text>
      <text x="88" y="106">照片</text>
      <text x="134" y="106">地图</text>
      <text x="180" y="106">设置</text>
      <text x="42" y="164">Safari</text>
      <text x="88" y="164">备忘录</text>
      <text x="134" y="164">信息</text>
      <text x="180" y="164">天气</text>
      <text x="42" y="222">相机</text>
      <text x="88" y="222">MyApp</text>
    </g>
    <rect x="22" y="372" width="176" height="52" rx="16" fill="#ffffff" fill-opacity="0.28"/>
    <g fill="#ffffff" fill-opacity="0.92">
      <rect x="34" y="380" width="36" height="36" rx="9"/>
      <rect x="78" y="380" width="36" height="36" rx="9"/>
      <rect x="122" y="380" width="36" height="36" rx="9"/>
    </g>
    <rect x="75" y="430" width="70" height="5" rx="2.5" fill="#ffffff"/>
    <!-- pointer -->
    <circle cx="92" cy="192" r="12" fill="#ff9f43" fill-opacity="0.35" stroke="#ff9f43" stroke-width="2"/>
    <path d="M96 196 l0 26 l7 -7 l6 12 l5 -2 l-6 -12 l10 0 z" fill="#1f2330" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- callouts -->
  <g font-size="12" fill="#3a3f4d">
    <rect x="30" y="200" width="250" height="118" rx="10" fill="#ffffff" stroke="#d6d9e0"/>
    <text x="46" y="224" font-weight="700" fill="#d9653b">直接在画面上操作</text>
    <text x="46" y="246">• 单击 = tap，按住拖动 = 手势</text>
    <text x="46" y="266">• 坐标自动扣除黑边、按方向换算</text>
    <text x="46" y="286">• 你和 Claude 驱动的是同一台模拟器</text>
    <text x="46" y="306">• MJPEG 实时流，断线自动退避重连</text>
    <line x1="280" y1="258" x2="408" y2="336" stroke="#d9653b" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="600" y="200" width="250" height="138" rx="10" fill="#ffffff" stroke="#d6d9e0"/>
    <text x="616" y="224" font-weight="700" fill="#d9653b">显示设置（自动记住）</text>
    <text x="616" y="246">• 尺寸：适应 / 50–125% / S·M·L</text>
    <text x="616" y="266">• 外框：无框 / 边框 / 真机框</text>
    <text x="616" y="286">• 顶部下拉可切换 / 启动设备</text>
    <text x="616" y="306">• 界面中英双语，跟随浏览器语言</text>
    <text x="616" y="326">• 仅监听 127.0.0.1</text>
    <line x1="780" y1="200" x2="780" y2="128" stroke="#d9653b" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="30" y="360" width="250" height="118" rx="10" fill="#ffffff" stroke="#d6d9e0"/>
    <text x="46" y="384" font-weight="700" fill="#d9653b">工具栏</text>
    <text x="46" y="406">• 回到桌面：单击 Home，双击后台 App</text>
    <text x="46" y="426">• 截图：新标签页打开原图</text>
    <text x="46" y="446">• 旋转：四个方向循环</text>
    <text x="46" y="466">• 设备操作：锁屏 / 解锁 / 摇一摇 / Siri…</text>
  </g>
  </g>
</svg>
