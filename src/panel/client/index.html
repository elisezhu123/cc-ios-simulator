<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iOS Simulator</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/main.js"></script>
</head>
<body>
  <header class="titlebar">
    <span class="title" id="title">iOS Simulator</span>
    <span id="status" class="status" role="status" data-kind="connecting"></span>
    <button id="btn-fullscreen" class="icon-button" type="button"></button>
  </header>
  <nav class="menubar">
    <button id="menu-devices" class="menu-button" type="button"><span id="device-name"></span><span id="device-runtime" class="muted"></span></button>
    <button id="menu-device" class="menu-button" type="button"></button>
    <button id="menu-debug" class="menu-button" type="button"></button>
  </nav>
  <main class="stage" id="stage">
    <div class="frame" id="frame">
      <div class="screen" id="screen">
        <img id="stream" alt="" draggable="false">
      </div>
    </div>
    <p id="placeholder" class="placeholder" hidden></p>
    <p id="toast" class="toast" role="status" hidden></p>
  </main>
  <div class="dock" id="dock" role="toolbar">
    <button id="btn-home" type="button"></button>
    <span class="dock-separator"></span>
    <button id="btn-annotate" type="button"></button>
    <button id="btn-screenshot" type="button"></button>
    <button id="btn-record" type="button"></button>
    <span class="dock-separator"></span>
    <button id="btn-rotate" type="button"></button>
    <span class="dock-separator"></span>
    <button id="btn-shutdown" class="danger" type="button"></button>
    <button id="btn-detach" class="danger" type="button"></button>
  </div>
</body>
</html>
